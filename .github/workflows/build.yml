name: Full Build
#
# CI workflow: resolve configuration then build kernel + package boot image.
# Runs on ubuntu-latest (x86_64) but cross-compiles for arm64 target.
# The SoC layer is supplied through --local-module, so this runs before
# UniXNU-mt6899-common is published in feeds.toml.
#
# NOTE: -D/--device paths must be ABSOLUTE. The device repository sits
# next to (not inside) the UniXNU checkout, so a relative UNIXNU_DEVICE
# resolved against the UniXNU working directory and failed with
# "has no board.toml".

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: full-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-rodin
  SOC_MODULE: soc:mt6899=${{ github.workspace }}/UniXNU-mt6899-common

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-rodin

      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU

      - name: Checkout UniXNU-mt6899-common
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UniXNU-mt6899-common
          path: UniXNU-mt6899-common

      - name: Make unixnu executable
        run: chmod +x UniXNU/unixnu

      - name: Toolchain prerequisites
        run: |
          python3 --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler ninja-build unifdef

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-${{ runner.os }}-v1

      - name: Build UniXNU toolchain (clang with xnu builtins, ld64, mig, iig)
        # Idempotent: with a cache hit this only refreshes the /usr/bin shims
        # (xcrun, plutil, codesign) that the cache cannot carry and skips the
        # LLVM/cctools/mig/iig/lzfse builds because their outputs exist.
        run: |
          cd UniXNU
          sudo scripts/linux/setup-toolchain.py /opt/unixnu-linux
          /opt/unixnu-linux/llvm/bin/clang --version

      - name: Save toolchain cache
        # actions/cache's own post step only saves when the whole job succeeds,
        # so save explicitly here: a later build failure must not cost the
        # next run another full toolchain build.
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-${{ runner.os }}-v1

      - name: Verify toolchain
        run: /opt/unixnu-linux/llvm/bin/clang --version

      - name: Debug environment
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "UNIXNU_DEVICE=$UNIXNU_DEVICE"
          echo "SOC_MODULE=$SOC_MODULE"
          ls -la "$UNIXNU_DEVICE/board.toml" || echo "board.toml MISSING"
          head -5 "$UNIXNU_DEVICE/board.toml" || true

      - name: Resolver defconfig
        run: |
          cd UniXNU
          set -o pipefail
          ./unixnu defconfig rodin_defconfig --local-module "$SOC_MODULE" 2>&1 | tee defconfig.log
          rc=${PIPESTATUS[0]}
          echo "defconfig exit code: $rc"
          test "$rc" -eq 0

      - name: Resolver fetch
        run: |
          cd UniXNU
          set -o pipefail
          ./unixnu fetch --local-module "$SOC_MODULE" 2>&1 | tee fetch.log
          rc=${PIPESTATUS[0]}
          echo "fetch exit code: $rc"
          test "$rc" -eq 0

      - name: Resolver status
        run: |
          cd UniXNU
          set -o pipefail
          ./unixnu status --json --local-module "$SOC_MODULE" 2>&1 | tee status.json
          ./unixnu status --local-module "$SOC_MODULE" 2>&1 | tee status_plain.log
          rc=${PIPESTATUS[0]}
          echo "status exit code: $rc"
          test "$rc" -eq 0

      - name: Apply kernel build workarounds (early)
        run: |
          cd UniXNU
          python3 - <<'PY'
          import pathlib

          marker = 'OSDefineMetaClassAndStructors (ArmVirtPlatform, IODTPlatformExpert)'
          stub = '\n// Weak stub for arm64 platform sleep hook referenced from ArmCpu::start().\nextern "C" __attribute__((weak)) void arm64_platform_sleep_hook(void) {}\n\n'
          patched = 0
          for p in pathlib.Path('.').rglob('ArmVirtPlatform.cpp'):
              try:
                  s = p.read_text()
              except Exception:
                  continue
              if 'arm64_platform_sleep_hook' in s:
                  continue
              if marker in s:
                  s = s.replace(marker, stub + marker)
              else:
                  s += '\nextern "C" __attribute__((weak)) void arm64_platform_sleep_hook(void) {}\n'
              p.write_text(s)
              print('patched:', p)
              patched += 1
          print('total patched:', patched)
          PY

      - name: Apply kernel build workarounds
        run: |
          cd UniXNU
          python3 - <<'PY'
          import pathlib

          marker = 'OSDefineMetaClassAndStructors (ArmVirtPlatform, IODTPlatformExpert)'
          stub = '\n// Weak stub for arm64 platform sleep hook referenced from ArmCpu::start().\nextern "C" __attribute__((weak)) void arm64_platform_sleep_hook(void) {}\n\n'
          patched = 0
          for p in pathlib.Path('.').rglob('ArmVirtPlatform.cpp'):
              try:
                  s = p.read_text()
              except Exception:
                  continue
              if 'arm64_platform_sleep_hook' in s:
                  continue
              if marker in s:
                  s = s.replace(marker, stub + marker)
              else:
                  s += '\nextern "C" __attribute__((weak)) void arm64_platform_sleep_hook(void) {}\n'
              p.write_text(s)
              print('patched:', p)
              patched += 1
          print('total patched:', patched)
          PY

      - name: Build kernel (cross-compile for arm64)
        run: |
          cd UniXNU
          set -o pipefail
          ./unixnu build kernel --local-module "$SOC_MODULE" 2>&1 | tee build_kernel.log
          rc=${PIPESTATUS[0]}
          echo "kernel exit code: $rc"
          test "$rc" -eq 0

      - name: Assemble tree
        run: |
          cd UniXNU
          set -o pipefail
          ./unixnu tree --local-module "$SOC_MODULE" 2>&1 | tee tree.log
          rc=${PIPESTATUS[0]}
          echo "tree exit code: $rc"
          test "$rc" -eq 0

      - name: Collect outputs
        run: |
          cd UniXNU
          # The boot image is written to out/<board>/<os>/<config>/boot/ by
          # "unixnu bootimg" (firmware volume + DTB). Collect any that exist.
          mkdir -p artifact/boot
          found=0
          while IFS= read -r f; do
            cp -v "$f" artifact/boot/ && found=$((found + 1))
          done < <(find out -type f \( -name 'boot.img' -o -name 'boot.image' \) 2>/dev/null)
          echo "boot images collected: $found"
          if [ "$found" -eq 0 ]; then
            echo "NOTE: no boot image produced. 'unixnu build kernel' + 'unixnu tree'"
            echo "do not pack one; that needs a Mu-Silicium checkout plus"
            echo "'unixnu build firmware --uefi DIR' and 'unixnu bootimg --uefi DIR'."
          fi
          find out -maxdepth 6 -type f \( -name '*.macho' -o -name 'kernel*' -o -name '*.fd' \) 2>/dev/null | head -20 || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            UniXNU/status.json
            UniXNU/unixnu.lock
            UniXNU/defconfig.log
            UniXNU/fetch.log
            UniXNU/status_plain.log
            UniXNU/build_kernel.log
            UniXNU/tree.log
            UniXNU/out/**/logs/*.log
            UniXNU/artifact/boot/*
          if-no-files-found: warn
