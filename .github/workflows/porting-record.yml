name: Porting record
on:
  push:
  pull_request:

concurrency:
  group: porting-record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device repository
        uses: actions/checkout@v4

      - name: Checkout UniXNU (checker source)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU

      - name: Check the device porting record
        run: |
          python3 UniXNU/scripts/porting-record.py check --device "$GITHUB_WORKSPACE"
