# UEFI firmware configuration for rodin (Redmi Turbo 4 / POCO X7 Pro)
# SoC: MediaTek Dimensity 8400-Ultra (MT6899, aarch64)
# This file is read by the Mu-Silicium / UniXNU build system.

schema_version = 2

[board]
name = "rodin"
soc = "mt6899"
soc_source = "mt6899"
os_profile = "ipados-17.7.11-21H461"  # arm64 profile; identity inherited from profile

[ firmware ]
# Kernelcache from the selected OS profile (ipados-17.7.11-21H461)
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
kernelcache_slide  = "-0x1000000"
# Path to the compiled device tree (generated from dts/rodin.dtb)
dtb_path = "dts/rodin.dtb"
# DRAM size — 12 GiB test device; vendor DTB only reserves 1 GiB low window
dram_size = "0x300000000"
# PSCI method (confirmed from vendor DTB)
psci_method = "smc"

[device]
verbose = false

[components]
include = ["ArmVirtPlatform", "ArmDTPlatform", "ArmCpu", "XnuPrelink", "SoftwareAES"]
# TODO: extend with reviewed catalog IDs once storage/display/input
# implementations are chosen. The device include array replaces the
# inherited array, so keep the complete list here。

[device_tree]
source = "device:dts/rodin.dts"
include_dirs = ["soc:dts"]

# [ipsw] — inherited from the OS profile (profiles/os/ipados-17.7.11-21H461):
# url (iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw), product "iPad7,1",
# version "17.7.11", build "21H461", chip_id 32785, board_id 12, fetch list,
# and the sha256 pins for the disk images. The device overrides nothing
# until a rodin-specific identity is needed。

[userdata]
first_lba = 0x354300 # GPT 'userdata' entry, from /dev/block/sdc gpt dump 2026-11-15
last_lba = 0x3d937f7 # ~233 GiB partition; disk block size 4096
lba_bytes = 4096

[kernel]
defconfig = "rodin_defconfig"
config_fragments = ["soc:configs/mt6899.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmVirtPlatform",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
]

# [kernel.prelink] — inherited from the OS profile: emit_prelink tool,

